<div class="card-form">
  <div class="form-header">
    <h3>{{ isEditMode ? 'Edit Product Item' : 'Add New Product' }}</h3>
    <p class="subtitle">Enter inventory specifications, stock thresholds, and pricing.</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    <span>⚠️ {{ errorMessage }}</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <!-- SKU -->
      <div class="form-group">
        <label for="sku">SKU Code *</label>
        <input id="sku" type="text" formControlName="sku" placeholder="e.g. LOG-900">
        <small class="error-text" *ngIf="form.get('sku')?.touched && form.get('sku')?.hasError('required')">
          SKU is required.
        </small>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="category">Category *</label>
        <select id="category" formControlName="category">
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
      </div>

      <!-- Name -->
      <div class="form-group span-2">
        <label for="name">Product Title *</label>
        <input id="name" type="text" formControlName="name" placeholder="e.g. MX Master 3S Wireless Mouse">
        <small class="error-text" *ngIf="form.get('name')?.touched && form.get('name')?.hasError('required')">
          Product title is required.
        </small>
      </div>

      <!-- Description -->
      <div class="form-group span-2">
        <label for="description">Description</label>
        <textarea id="description" rows="3" formControlName="description" placeholder="Technical specifications or details..."></textarea>
      </div>

      <!-- Price -->
      <div class="form-group">
        <label for="price">Unit Price (R$) *</label>
        <input id="price" type="number" step="0.01" formControlName="price" placeholder="0.00">
        <small class="error-text" *ngIf="form.get('price')?.touched && form.get('price')?.invalid">
          Valid price above zero is required.
        </small>
      </div>

      <!-- Quantity in stock -->
      <div class="form-group">
        <label for="quantityInStock">Current Stock Quantity *</label>
        <input id="quantityInStock" type="number" formControlName="quantityInStock">
      </div>

      <!-- Min stock -->
      <div class="form-group">
        <label for="minStock">Safety / Minimum Stock Alert *</label>
        <input id="minStock" type="number" formControlName="minStock">
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-outline" (click)="onCancel()" [disabled]="loading">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span *ngIf="!loading">{{ isEditMode ? 'Update Product' : 'Save Product' }}</span>
        <span *ngIf="loading">Processing...</span>
      </button>
    </div>
  </form>
</div>
